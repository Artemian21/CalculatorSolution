name: CI Pipeline

on:
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CalculatorSolution.sln

      - name: Build solution
        run: dotnet build CalculatorSolution.sln --configuration Release

      - name: Run tests
        run: dotnet test CalculatorSolution.sln --logger "trx;LogFileName=test_results.trx"

  analysis:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v3

      - name: Code Review Check for develop
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed("Це не Pull Request");
              return;
            }

            const prNumber = pr.number;
            const { data: reviews } = await github.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            console.log("Знайдені рев’ю:");
            reviews.forEach(r => {
              console.log(`User: ${r.user.login}, State: ${r.state}`);
            });

            const approved = reviews.some(review => review.state === 'APPROVED');

            if (!approved) {
              core.setFailed("Код-рев’ю не схвалено");
            } else {
              console.log("Є схвалене рев’ю");
            }